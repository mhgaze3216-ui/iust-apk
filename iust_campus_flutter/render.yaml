databases:
  - name: iust-campus-db
    databaseName: iust_campus
    user: iust_app
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: iust-campus-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: iust-campus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: iust-campus-api
      - key: JWT_AUDIENCE
        value: iust-campus-client
      - key: CORS_ORIGINS
        sync: false
