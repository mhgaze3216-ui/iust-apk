name: iust_campus_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3


flutter:
  uses-material-design: true
  assets:
    - assets/img/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/logo_iust.png"
  image_path_ios: "assets/img/logo_iust_ios.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/img/logo_iust_adaptive_foreground.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

